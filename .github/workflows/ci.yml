name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run local composite action
        uses: ./
        with:
          repo: ${{ github.repository }}
          max-prs: "10"
      - name: Verify reports exist
        shell: bash
        run: |
          test -s maintainer-budget.md
          test -s maintainer-budget.json
          test -s maintainer-budget-share.md
          test -s maintainer-budget-codex.md
