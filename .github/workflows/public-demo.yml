name: Public OSS demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/public-demo.yml
      - src/maintainer_budget/**
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  nextjs:
    name: Audit vercel/next.js
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install current main
        run: python -m pip install .

      - name: Audit public review history
        env:
          # Deliberately unauthenticated so this public demo does not depend on
          # cross-repository permissions from this repository's GITHUB_TOKEN.
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          maintainer-budget audit vercel/next.js \
            --max-prs 60 \
            --output demo-nextjs.md \
            --json demo-nextjs.json \
            --share-card demo-nextjs-share.md \
            --codex-bundle demo-nextjs-codex.md

      - name: Show result in Actions summary
        run: |
          cat demo-nextjs-share.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n> Public demo: read-only audit of recent merged PR review history from `vercel/next.js`.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload public demo evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-nextjs
          path: |
            demo-nextjs.md
            demo-nextjs.json
            demo-nextjs-share.md
            demo-nextjs-codex.md
          if-no-files-found: error
          retention-days: 30
